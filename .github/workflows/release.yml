name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  package:
    runs-on: ubuntu-latest
    environment: release
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install
      - run: npm run verify
      - run: npm run package -w sentinel-vscode
      - uses: actions/upload-artifact@v4
        with:
          name: sentinel-vscode-vsix
          path: packages/extension/sentinel-vscode-0.1.0.vsix
      - name: Publish extension
        if: ${{ secrets.VSCE_PAT != '' }}
        run: npx vsce publish --no-dependencies -p "${{ secrets.VSCE_PAT }}"
